[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "imagededup-system-dbwork"
version = "0.1.0"
authors = []
description = "Perceptual image deduplication with FastAPI, imagededup and DBWorker."
readme = "README.md"
packages = [{ include = "imagededup_system_dbwork", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
dbworker = { path = "../..", develop = true }
fastapi = ">=0.115,<1.0"
uvicorn = { extras = ["standard"], version = ">=0.30,<1.0" }
sqlalchemy = ">=2.0,<3.0"
pydantic = ">=2.0,<3.0"

imagededup = "==0.3.3.post2"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1.0"
mypy = ">=1.0,<3.0"

[tool.poetry.scripts]
imagededup-system-dbwork-api = "imagededup_system_dbwork.main_fastapi:run"
imagededup-system-dbwork-workers = "imagededup_system_dbwork.main_worker_service:run"
