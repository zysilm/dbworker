name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: .
            paths: src tests
            artifact: true
          - project: examples/imagededup_system_dbwork
            paths: src tests
            artifact: false
          - project: examples/imagededup_system_redis_celery
            paths: src tests
            artifact: false
          - project: benchmarks/imagededup_benckmark
            paths: src tests
            artifact: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.0"

      - name: Install project dependencies
        working-directory: ${{ matrix.project }}
        run: poetry install --with dev --no-interaction

      - name: Validate package metadata
        working-directory: ${{ matrix.project }}
        run: poetry check

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: poetry run pytest

      - name: Check types
        working-directory: ${{ matrix.project }}
        run: poetry run mypy --strict ${{ matrix.paths }}

      - name: Build distributions
        working-directory: ${{ matrix.project }}
        run: poetry build

      - uses: actions/upload-artifact@v4
        if: matrix.artifact
        with:
          name: dbworker-distributions
          path: dist/
