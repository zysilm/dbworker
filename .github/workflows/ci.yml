name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-finalization-windows:
    name: SQLite finalization (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install core test dependencies
        run: python -m pip install . pytest
      - name: Verify SQLite finalization under contention
        run: python -m pytest tests/test_sqlite_finalization.py -v

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: .
            test_paths: tests
            artifact: true
          - project: examples/imagededup_system_dbwork
            test_paths: tests
            artifact: false
          - project: examples/imagededup_system_redis_celery
            test_paths: tests
            artifact: false
          - project: benchmarks/imagededup_benckmark
            test_paths: tests
            artifact: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.0"

      - name: Install project dependencies
        working-directory: ${{ matrix.project }}
        run: poetry install --with dev --no-interaction

      - name: Validate package metadata
        working-directory: ${{ matrix.project }}
        run: poetry check

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: poetry run pytest ${{ matrix.test_paths }}

      - name: Build distributions
        working-directory: ${{ matrix.project }}
        run: poetry build

      - uses: actions/upload-artifact@v4
        if: matrix.artifact
        with:
          name: dbworker-distributions
          path: dist/

  postgres-claims:
    name: PostgreSQL ownership and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: dbworker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark -d dbworker_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install . "psycopg[binary]==3.3.6"
      - name: Verify competing claims, leases and transaction rollback
        env:
          DBWORKER_TEST_POSTGRES_URL: postgresql+psycopg://benchmark:benchmark@127.0.0.1:5432/dbworker_test
        run: python -m unittest discover -s tests -p test_postgres_claims.py -v
