name: Security checks

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
    uses: actions/dependency-review-action@v4

  codeql:
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3

  dependency-audit-and-bandit:
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.0"

      - name: Install project dependencies
        run: poetry install --with dev --no-interaction

      - name: Install security tools
        run: poetry run python -m pip install pip-audit bandit

      - name: Audit installed dependencies
        run: poetry run pip-audit --strict

      - name: Scan Python security patterns
        run: poetry run bandit -r src -q
