name: Publish to PyPI

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbworker
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-dbworker
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.0"

      - name: Validate package metadata
        run: poetry check

      - name: Build distributions
        run: poetry build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
