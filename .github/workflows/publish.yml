name: Publish to PyPI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbworker
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-dbworker
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.0"

      - name: Validate package metadata
        run: poetry check

      - name: Build distributions
        run: poetry build

      - name: Check whether this version is already published
        id: release
        env:
          PACKAGE_NAME: dbworker
        run: |
          version="$(poetry version --short)"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/${PACKAGE_NAME}/${version}/json")"
          if [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not determine whether ${PACKAGE_NAME} ${version} is published (HTTP ${status})." >&2
            exit 1
          fi

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
