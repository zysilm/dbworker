name: Full application benchmarks

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - 'doc/**'
      - 'docs/**'
      - 'benchmarks/results/**'

concurrency:
  group: native-application-benchmarks-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  experiment:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - suite: imagededup
            label: "Images - 1,000 images, 999,000 pairs, 8 producers"
          - suite: superset
            label: "SQL Lab - 3,000 queries, 8 producers, 60s"
          - suite: saleor
            label: "Exports - 1,000 x 256 products and emails, 8 producers, 60s"
          - suite: paperless_ngx
            label: "OCR - 200 scans, 8 producers, 60s"
          - suite: posthog
            label: "2FA - 5,000 requests and 10,000 tasks, 8 producers, 60s"
          - suite: sentry
            label: "Email - 2,000 requests and 4,000 deliveries, 8 producers, 60s"
    steps:
      - uses: actions/checkout@v5
      - name: Initialize only this experiment's pinned source
        if: matrix.suite != 'imagededup'
        env:
          SUITE: ${{ matrix.suite }}
        run: git submodule update --init --depth 1 -- "examples/$SUITE"
      - name: Check the original Celery worker entry point
        env:
          SUITE: ${{ matrix.suite }}
        run: python3 -m benchmarks.check_native --suite "$SUITE"
      - name: Build a fresh benchmark container
        run: docker build --pull --tag dbworker-benchmark --file benchmarks/Dockerfile benchmarks
      - name: Run the full experiment in isolation
        env:
          SUITE: ${{ matrix.suite }}
          RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env BENCHMARK_RUNNER_CLASS=github-hosted-docker \
            --env PYTHONPATH=/workspace:/workspace/src \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            dbworker-benchmark benchmarks/run_all.py \
            --suite "$SUITE" --profile full --provision --run-id "$RUN_ID" \
            --timeout-seconds 4800 --output-dir benchmarks/results/ci-full
      - name: Package result evidence and failure diagnostics
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          python3 benchmarks/ci_results.py package \
            --source benchmarks/results/ci-full --output benchmark-artifact --suite "$SUITE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.suite }}
          path: benchmark-artifact/
          retention-days: 2
          if-no-files-found: warn

  publish:
    name: Validate and aggregate all experiments
    needs: experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Initialize pinned sources for independent source validation
        run: git submodule update --init --depth 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies for independent admission checks
        run: python -m pip install --constraint benchmarks/locks/sentry-native.txt celery==5.3.5 Django==3.2.23 SQLAlchemy==2.0.52 psutil==7.2.2
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: incoming
      - name: Normalize artifact directories
        run: |
          for directory in incoming/benchmark-*; do
            mv "$directory" "incoming/${directory##*/benchmark-}"
          done
      - name: Verify aggregation and report integrity
        env:
          PYTHONPATH: .:src
        run: >-
          python -m unittest
          benchmarks.tests.test_ci_results benchmarks.tests.test_reporting
          benchmarks.tests.test_orchestration
          benchmarks.tests.test_native_admission benchmarks.tests.test_native_origin
          benchmarks.tests.test_native_observer benchmarks.tests.test_native_binding
          benchmarks.tests.test_argument_evidence benchmarks.tests.test_worker_origin
          benchmarks.tests.test_sentry_provision benchmarks.tests.test_sentry_native
          benchmarks.tests.test_smtp_evidence benchmarks.tests.test_workflow_graph
          benchmarks.tests.test_timing_evidence benchmarks.tests.test_business_evidence
          benchmarks.tests.test_business_input
          benchmarks.tests.test_load benchmarks.tests.test_load_evidence
          benchmarks.tests.test_performance_admission benchmarks.tests.test_saleor_producer
          benchmarks.tests.test_posthog_producer benchmarks.tests.test_paperless_producer
          benchmarks.tests.test_posthog_trace benchmarks.tests.test_posthog_worker_service
          benchmarks.tests.test_superset_binding benchmarks.tests.test_superset_result_capacity
          benchmarks.tests.test_superset_output
          benchmarks.tests.test_upstream_correctness
      - name: Assemble a complete validated result set
        env:
          RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          rm -rf benchmarks/results/latest
          python benchmarks/ci_results.py combine \
            --incoming incoming --output benchmarks/results/latest \
            --run-id "$RUN_ID" --commit "$SOURCE_COMMIT"
      - name: Render detailed results and the compact workflow summary
        run: |
          python benchmarks/render_results.py --run-dir benchmarks/results/latest --output doc/benchmark-results.md
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from benchmarks.render_results import update_readme
          compact = update_readme(Path("benchmarks/results/latest"), Path("README.md"))
          section = compact.split("<!-- benchmark-results:start -->", 1)[1].split("<!-- benchmark-results:end -->", 1)[0]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(section)
          PYTHON
      - name: Publish compact README and detailed JSON results
        if: github.ref == 'refs/heads/main'
        env:
          BENCHMARK_RESULT_DIRECTORY: benchmarks/results/latest
          BENCHMARK_SOURCE_COMMIT: ${{ github.sha }}
        run: python benchmarks/publish_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-complete
          path: |
            benchmarks/results/latest/
            doc/benchmark-results.md
          retention-days: 2
