name: Benchmark correctness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install environment provisioner
        run: python -m pip install "uv==0.12.23" -r benchmarks/requirements.txt
      - name: Install native application prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server postgresql postgresql-client libpq-dev \
            build-essential pkg-config libffi-dev libxml2-dev libxslt1-dev libxmlsec1-dev \
            libjpeg-dev zlib1g-dev libmagic1 ghostscript poppler-utils qpdf \
            imagemagick tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
          for directory in /usr/lib/postgresql/*/bin; do
            if [ -x "$directory/initdb" ]; then
              echo "$directory" >> "$GITHUB_PATH"
            fi
          done
      - name: Run real application correctness experiment sequentially
        run: python benchmarks/run_all.py --provision --profile smoke --output-dir "benchmarks/results/ci-smoke"
      - name: Verify orchestration and report integrity
        env:
          PYTHONPATH: .:src
        run: benchmarks/environments/saleor/celery/.venv/bin/python -m unittest discover -s benchmarks/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke
          path: benchmarks/results/ci-smoke/
