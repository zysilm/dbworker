[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dbworker"
version = "0.1.0"
description = "Database-backed coordination for process workers."
authors = []
readme = "README.md"
packages = [{ include = "dbworker.py", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
sqlalchemy = ">=2.0,<3.0"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.0,<3.0"
