[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dbworker"
version = "0.0.6"
description = "Portable, single-script Python/SQLAlchemy background worker for SQLite, PostgreSQL and MySQL — no Redis, broker or enqueue"
authors = ["Ziyang Song"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/zysilm/dbworker"
include = [{ path = "poetry.lock", format = "sdist" }]
packages = [{ include = "dbworker.py", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
sqlalchemy = ">=2.0,<3.0"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.0,<3.0"
pytest = "^9.1.1"
