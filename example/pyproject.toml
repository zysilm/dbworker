[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "durable-worker-example"
version = "0.1.0"
authors = []
description = "Small, generic example of durable database-backed work coordination."
packages = [{ include = "durable_worker_example", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.115,<1.0"
uvicorn = { extras = ["standard"], version = ">=0.30,<1.0" }
sqlalchemy = ">=2.0,<3.0"
pydantic = ">=2.0,<3.0"

[tool.poetry.scripts]
durable-worker-example-api = "durable_worker_example.main:run"
